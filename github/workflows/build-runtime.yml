name: Build matrix runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "matrix-data/**"
      - "engine/**"
      - "package.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run phase-a
      - name: Commit generated runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime
          git diff --cached --quiet || git commit -m "Build runtime matrix indexes"
          git push
