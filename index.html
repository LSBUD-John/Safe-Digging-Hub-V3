<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Safe Digging Hub</title><link rel="icon" href="data:,"><style>
:root{--b:#073b67;--s:#eaf6fc;--i:#172033;--m:#667085;--l:#dbe3ec;--bg:#f8fafc}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--i)}button,input,select{font:inherit}.top{height:68px;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.brand{font-size:21px;font-weight:900}.brand small{display:block;font-size:10px;color:var(--m);letter-spacing:.08em}.nav{display:flex;gap:22px}.nav button{border:0;background:none;color:var(--b);font-weight:800}.page{display:none}.page.active{display:block}.wrap{max-width:850px;margin:auto;padding:55px 24px 100px}.hero h1{font-size:52px;letter-spacing:-.04em}.hero p{font-size:20px;color:var(--m);line-height:1.5}.panel,.block{background:#fff;border:1px solid var(--l);border-radius:20px;padding:24px;box-shadow:0 10px 30px #073b6712;margin-top:22px}.intent{width:100%;border:0;border-bottom:2px solid #abc1d0;padding:12px 0;font-size:24px}.tiles,.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}.tile,.card{border:1px solid var(--l);border-radius:15px;background:#fff;padding:17px}.tile{font-weight:800;color:var(--b);cursor:pointer;text-align:left}.tile::before{content:'◯';display:block;font-size:30px;margin-bottom:10px}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.btn{border:0;border-radius:10px;padding:12px 17px;font-weight:800;cursor:pointer;text-decoration:none}.primary{background:var(--b);color:#fff}.secondary{background:#fff;color:var(--b);border:1px solid #b9cad8}.journey{max-width:1280px;margin:auto;padding:34px 24px 100px;display:grid;grid-template-columns:310px minmax(0,830px);gap:28px;justify-content:center;align-items:start}.summary{position:sticky;top:94px;background:#fff;border:1px solid var(--l);border-radius:18px;padding:20px;box-shadow:0 10px 30px #073b6714}.summary h2{font-size:24px}.sum{padding:12px 0;border-top:1px solid var(--l)}.sum:first-child{border-top:0}.sum b{display:block;text-transform:capitalize}.sum span{color:var(--m);line-height:1.4}.question{font-size:31px}.hint{color:var(--m)}.options{display:grid;gap:10px}.option{border:1px solid var(--l);border-radius:13px;background:#fff;padding:16px;text-align:left;font-weight:750;cursor:pointer}.option:hover{border-color:var(--b)}.risk{background:#fff8e8;padding:14px;border-radius:10px;margin:9px 0}.card h3{margin:0 0 8px}.card p{color:var(--m);line-height:1.4}.utility{background:#edf8e9}.route{display:flex;flex-direction:column}.route .btn{margin-top:auto;align-self:flex-start}.route.selected{box-shadow:0 0 0 2px var(--b)}.choices{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.notice{padding:14px;border-radius:12px;margin-top:16px;background:var(--s);border:1px solid #bddff0}.warn{background:#fff8e8;border-color:#efd394}.manual{border-top:1px solid var(--l);margin-top:18px;padding-top:18px}.manual-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.manual-grid label{display:block;font-size:12px;font-weight:800;color:var(--m);margin-bottom:5px}.manual-grid select{width:100%;padding:11px;border:1px solid var(--l);border-radius:9px}.hidden{display:none!important}@media(max-width:900px){.journey{grid-template-columns:1fr;max-width:850px}.summary{position:static}}@media(max-width:600px){.tiles,.cards,.manual-grid{grid-template-columns:1fr}.hero h1{font-size:40px}}
</style></head><body><header class="top"><div class="brand">Safe Digging Hub<small>DELIVERED BY LSBUD</small></div><div class="nav"><button onclick="page('home')">Home</button><button onclick="page('library')">Library</button><button>Sign in</button></div></header><main id="home" class="page active"><div class="wrap hero"><h1>Smarter decisions for safer work.</h1><p>Describe what you are planning. The Hub will explain relevant risks, surface free guidance and recommend the next action.</p><div class="panel"><b>What are you planning to do?</b><input id="intent" class="intent"><div class="tiles"><button class="tile quick">I am planning a house extension</button><button class="tile quick">I am installing new pipework</button><button class="tile quick">I collate C2 safe-dig packs</button><button class="tile quick">I am lopping trees</button></div><div class="actions"><span></span><button class="btn primary" onclick="start()">Continue</button></div></div></div></main><main id="flow" class="page"><div class="journey"><aside class="summary"><small>YOUR JOURNEY</small><h2>What we understand</h2><div id="summary"></div></aside><section><div id="step"></div><div id="results" class="hidden"></div></section></div></main><main id="library" class="page"><div class="wrap"><h1>Library</h1><div id="lib" class="cards"></div></div></main><script>const journeys={"house-extension":{"label":"I am planning a house extension","questions":[{"id":"role","prompt":"Which best describes you?","options":["Householder","Builder or groundworks contractor","Architect or designer","Project manager"]},{"id":"purpose","prompt":"What do you need the information for?","hint":"This determines whether the possible Utility Search routes use Information Only, Planned Works or Emergency.","options":["Information gathering or early planning","Works starting within the next 28 days","Works starting more than 28 days away","Emergency works","Not sure"]},{"id":"ground","prompt":"Will the work involve foundations, drainage, piling or other ground disturbance?","options":["Yes","No","Not sure"]},{"id":"location","prompt":"Where will the work take place?","options":["England","Scotland","Wales","Northern Ireland","More than one nation"]}],"risks":["Private service connections","Foundation excavation","Plant or materials loading the ground","Building close to buried assets"],"guidance":["Safe Digging Essentials","Do I Need a Utility Search?","Service Connection Risk Guide","Householder Safe Digging Checklist"],"services":["Utility Search","Top-Up Search","Select Surveys quote"],"routeTemplates":[["Domestic Works (General public)","Domestic building project"],["Planning Applications","Single property"],["Development Projects","Housing"],["Domestic Works (General public)","Installing services"]]},"pipework":{"label":"I am installing new pipework","questions":[{"id":"role","prompt":"What is your role in the work?","options":["Site operative","Project manager","Designer","Utility company representative"]},{"id":"purpose","prompt":"What do you need the information for?","hint":"This determines whether the possible Utility Search routes use Information Only, Planned Works or Emergency.","options":["Information gathering or early planning","Works starting within the next 28 days","Works starting more than 28 days away","Emergency works","Not sure"]},{"id":"route","prompt":"Where will most of the route be located?","options":["Within a highway","Cross-country or off-highway","Within one defined site","Not sure"]},{"id":"method","prompt":"Which construction method is most likely?","options":["Open trench","Drilling, moling or pipe jacking","Multiple separate excavations","Not yet decided"]},{"id":"location","prompt":"Where will the work take place?","options":["England","Scotland","Wales","Northern Ireland","More than one nation"]}],"risks":["Existing utility crossings","Loss of ground support","Heavy plant loading","Vibration or trenchless interaction"],"guidance":["Safe Digging Essentials","HSG47 Plain-English Summary","PAS128 Summary Guide"],"services":["Utility Search","Comprehensive Premium Search","Large Site Search","Select Surveys quote","Vacuum excavation"],"routeTemplates":[["Utility Works","Single excavation site (1.5m or shallower)"],["Utility Works","Linear project in highway"],["Utility Works","Linear project cross country"],["Utility Works","Horizontal drilling/moling/tunnelling/pipe jacking"]]},"c2-pack":{"label":"I collate C2 safe-dig packs","questions":[{"id":"role","prompt":"Which best describes your role?","options":["Pack collator","Pack manager or approver","Designer","Client representative"]},{"id":"purpose","prompt":"What do you need the information for?","hint":"This determines whether the possible Utility Search routes use Information Only, Planned Works or Emergency.","options":["Information gathering or early planning","Works starting within the next 28 days","Works starting more than 28 days away","Emergency works","Not sure"]},{"id":"project","prompt":"What type of project is the pack for?","options":["Highway project","Utility project","Housing or development","Planning application","Drainage or watercourse works"]},{"id":"location","prompt":"Where is the project?","options":["England","Scotland","Wales","Northern Ireland","More than one nation"]}],"risks":["Missing asset-owner responses","Search expiry","Incorrect project categorisation","Incomplete evidence trail"],"guidance":["C2 Pack Checklist","Utility Plans Explained","Top-Up Search Explained"],"services":["Utility Search","Top-Up Search","Comprehensive Premium Search","Saved history and reminders"],"routeTemplates":[["Utility Works","Single excavation site (1.5m or shallower)"],["Highways","C2 Enquiry (Stat Undertakers only)"],["Planning Applications","C2 Enquiry (Stat Undertakers only)"],["Development Projects","Housing"]]},"tree-work":{"label":"I am lopping or removing trees","questions":[{"id":"ground","prompt":"Will the work include stump removal, root excavation, stakes or anchors?","options":["Yes","No","Not sure"]},{"id":"purpose","prompt":"What do you need the information for?","hint":"This determines whether the possible Utility Search routes use Information Only, Planned Works or Emergency.","options":["Information gathering or early planning","Works starting within the next 28 days","Works starting more than 28 days away","Emergency works","Not sure"]},{"id":"overhead","prompt":"Are overhead power lines near the work or access route?","options":["Yes","No","Not sure"]},{"id":"plant","prompt":"Will a MEWP, crane or heavy vehicle be used?","options":["Yes","No","Not sure"]},{"id":"location","prompt":"Where will the work take place?","options":["England","Scotland","Wales","Northern Ireland","More than one nation"]}],"risks":["Overhead electricity","Root or stump interaction with buried services","Plant loading","Tree preservation and ecology constraints"],"guidance":["Tree Work Near Power Lines","Service Connection Risk Guide","Tree Preservation Order Guide","Safe Digging Essentials"],"services":["Utility Search","Environmental Constraints Report"],"routeTemplates":[["Woodland","Lopping & topping"],["Woodland","Tree removal"],["Domestic Works (General public)","Tree planting"],["Planning Applications","Tree preservation order"]]}};const library=[{"title":"Safe Digging Essentials","type":"PDF","href":"LSBUD_Insight_Safe_Digging_Essentials.pdf"},{"title":"Do I Need a Utility Search?","type":"PDF","href":"LSBUD_Insight_Do_I_Need_a_Utility_Search.pdf"},{"title":"Service Connection Risk Guide","type":"PDF","href":"LSBUD_Insight_Service_Connection_Risk_Guide.pdf"},{"title":"Householder Safe Digging Checklist","type":"PDF","href":"householder_safe_digging_checklist.pdf"},{"title":"HSG47 Plain-English Summary","type":"Guidance","href":"#"},{"title":"PAS128 Summary Guide","type":"Guidance","href":"#"},{"title":"C2 Pack Checklist","type":"Guidance","href":"#"},{"title":"Utility Plans Explained","type":"Guidance","href":"#"},{"title":"Top-Up Search Explained","type":"Guidance","href":"#"},{"title":"Tree Work Near Power Lines","type":"Guidance","href":"#"},{"title":"Tree Preservation Order Guide","type":"Guidance","href":"#"}];const types={'Agricultural Works':['Building project','Fencing / gates','Ditch clearance'],'Development Projects':['Commercial/industrial','Highway','Housing','Piling'],'Domestic Works (General public)':['Domestic building project','Driveway works','Tree planting','Fencing / gates','Installing services'],'Highways':['Construction/realignment','Resurfacing','Street furniture','C2 Enquiry (Stat Undertakers only)','Piling'],'Planning Applications':['Commercial/industrial','Single property','Multiple properties','C2 Enquiry (Stat Undertakers only)','Tree preservation order'],'Utility Works':['Single excavation site (1.5m or shallower)','Single excavation site (deeper than 1.5m)','Multiple excavations site (1.5m or shallower)','Multiple excavations site (deeper than 1.5m)','Linear project cross country','Linear project in highway','Horizontal drilling/moling/tunnelling/pipe jacking'],'Watercourses/Canals/Drainage':['Bank Works','Dredging','Field drainage','Ditch clearance'],'Woodland':['Lopping & topping','New planting','Tree removal']};let key=null,n=0,a={},chosen=null;const $=x=>document.getElementById(x);function page(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id))}function detect(t){t=t.toLowerCase();if(/c2|pack/.test(t))return'c2-pack';if(/tree|lop/.test(t))return'tree-work';if(/pipe|water company/.test(t))return'pipework';return'house-extension'}function start(){key=detect($('intent').value||'house extension');n=0;a={intent:$('intent').value};chosen=null;page('flow');question()}document.querySelectorAll('.quick').forEach(b=>b.onclick=()=>{$('intent').value=b.textContent;start()});function question(){const q=journeys[key].questions[n];$('step').innerHTML=`<div class="block"><h2 class="question">${q.prompt}</h2>${q.hint?`<p class="hint">${q.hint}</p>`:''}<div class="options">${q.options.map((x,i)=>`<button class="option" data-a="${i}">${String.fromCharCode(65+i)} &nbsp; ${x}</button>`).join('')}</div><div class="actions"><button class="btn secondary" id="back">${n?'Back':'Cancel'}</button><span></span></div></div>`;document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>answer(q.id,q.options[+b.dataset.a]));$('back').onclick=()=>n?(n--,question()):page('home');summary()}function answer(id,v){a[id]=v;if(n<journeys[key].questions.length-1){n++;question()}else results()}function summary(){const rows=[['Activity',journeys[key].label],...Object.entries(a).filter(x=>x[0]!=='intent')];if(chosen)rows.push(['OneCall route',chosen.join(' · ')]);$('summary').innerHTML=rows.map(x=>`<div class="sum"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}function future(){return a.purpose==='Works starting more than 28 days away'?'<div class="notice warn"><b>Works are more than 28 days away.</b><br>Consider delaying a Planned Works enquiry until within 28 days. If proceeding now, repeat the search within 28 days of the start date.</div>':''}function results(){const j=journeys[key];$('step').innerHTML='';$('results').classList.remove('hidden');$('results').innerHTML=`<div class="block"><h2>Key considerations</h2>${future()}${j.risks.map(x=>`<div class="risk"><b>${x}</b><br><small>Review this risk before the work method is confirmed.</small></div>`).join('')}</div><div class="block"><h2>Free guidance</h2><div class="cards">${j.guidance.map(x=>`<div class="card"><h3>${x}</h3><button class="btn secondary">Read or download</button></div>`).join('')}</div></div><div class="block"><h2>Recommended next actions</h2><div class="cards">${j.services.map((x,i)=>`<div class="card ${x==='Utility Search'?'utility':''}"><h3>${x}</h3><p>Continue to an enquiry, quote or supporting service.</p><button class="btn primary" data-s="${i}">Explore</button></div>`).join('')}</div></div><div id="utility"></div>`;document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>j.services[+b.dataset.s]==='Utility Search'?utility():alert('Prototype: '+j.services[+b.dataset.s]));summary()}function enquiryType(){if(a.purpose==='Information gathering or early planning'||a.purpose==='Works starting more than 28 days away')return'Information Only';if(a.purpose==='Emergency works')return'Emergency';if(a.purpose==='Works starting within the next 28 days')return'Planned Works';return'Information Only'}function routeOrder(j){let rows=j.routeTemplates.map(x=>[enquiryType(),...x]);if(key==='house-extension'){const d=[enquiryType(),'Domestic Works (General public)','Domestic building project'];rows=[d,...rows.filter(r=>!(r[1]===d[1]&&r[2]===d[2]))]}return rows.slice(0,4)}function utility(){chosen=null;summary();const rows=routeOrder(journeys[key]);$('utility').innerHTML=`<div class="block"><h2>Possible OneCall routes</h2><p>Each route uses the Enquiry Type implied by your purpose. Select the category and work type that accurately describe the activity.</p>${future()}<div class="cards">${rows.map((r,i)=>`<div class="card route" data-rbox="${i}"><h3>Option ${i+1}</h3><p><b>${r[0]}</b><br><b>${r[1]}</b><br>${r[2]}</p><button class="btn primary" data-r="${i}">Select this route</button></div>`).join('')}</div><div class="choices"><button class="btn secondary" id="help">I need help choosing</button><button class="btn secondary" id="manual">Choose from all OneCall options</button></div><div id="manualPanel"></div><div class="notice"><b>Your choice remains your responsibility.</b><br>Confirm that the selections accurately describe the proposed activity.</div><div class="actions"><span></span><button class="btn primary" id="continue" disabled>Continue</button></div></div>`;document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{chosen=rows[+b.dataset.r];document.querySelectorAll('[data-rbox]').forEach((c,i)=>c.classList.toggle('selected',i===+b.dataset.r));$('continue').disabled=false;summary()});$('manual').onclick=manual;$('help').onclick=()=>alert('Prototype: ask one more question about the project, depth, route or method.');$('continue').onclick=()=>chosen&&alert('Next step: site details. User-selected route: '+chosen.join(' | '));$('utility').scrollIntoView({behavior:'smooth'})}function manual(){const cats=Object.keys(types);$('manualPanel').innerHTML=`<div class="manual"><h3>Choose from all OneCall options</h3><div class="manual-grid"><div><label>Enquiry Type</label><select id="me"><option>Information Only</option><option>Planned Works</option><option>Emergency</option></select></div><div><label>Work Category</label><select id="mc">${cats.map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>Work Type</label><select id="mw"></select></div></div><div class="actions"><span></span><button class="btn primary" id="ms">Select this route</button></div><div id="confirm"></div></div>`;$('me').value=enquiryType();const fill=()=>{$('mw').innerHTML=types[$('mc').value].map(x=>`<option>${x}</option>`).join('');if($('mc').value==='Utility Works')$('mw').value='Single excavation site (1.5m or shallower)'};$('mc').onchange=fill;fill();$('ms').onclick=()=>{chosen=[$('me').value,$('mc').value,$('mw').value];$('continue').disabled=false;$('confirm').innerHTML=`<div class="notice">Selected manually: <b>${chosen.join(' · ')}</b></div>`;summary()}}function renderLib(){$('lib').innerHTML=library.map(x=>`<div class="card"><h3>${x.title}</h3>${x.href==='#'?'<button class="btn secondary">Open</button>':`<a class="btn secondary" href="${x.href}" download>Download</a>`}</div>`).join('')}renderLib();</script></body></html>
